name: CI - UV install

on:
  push:
  pull_request:

jobs:
  uv-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install UV (package manager)
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dependencies (UV)
        run: |
          if [ -f uv.lock ]; then
            uv install
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "No lockfile or requirements.txt found; skipping dependency install"
          fi

      - name: Run notebooks (optional)
        run: |
          if [ -d "IOT Data Simulation" ]; then
            for nb in "IOT Data Simulation"/*.ipynb; do
              jupyter nbconvert --to notebook --execute "$nb" --ExecutePreprocessor.timeout=600 || exit 1
            done
          else
            echo "No notebooks directory; skipping"
          fi
